[package]
name = "freehold-ios-ffi"
version = "0.1.0"
edition = "2021"
description = "C FFI bindings for Freehold iOS integration"

[lib]
crate-type = ["staticlib", "cdylib"]
name = "freehold_ffi"

[dependencies]
freehold-client-core = { path = "../../../crates/freehold-client-core", features = ["h3-proxy"] }
freehold-api = { path = "../../../crates/freehold-api" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.19"
libc = "0.2"

[build-dependencies]
cbindgen = "0.28"

[features]
default = []
