# cbindgen configuration for Freehold iOS FFI

language = "C"
header = """
// Freehold iOS FFI - Auto-generated C header
// Do not edit manually.
//
// This header provides C-compatible bindings for the Freehold client
// library, allowing integration with Swift via C interop.
"""

include_guard = "FREEHOLD_FFI_H"
include_version = true
autogen_warning = "/* Warning: This file is autogenerated by cbindgen. Don't modify this manually. */"

[defines]
"feature = vpn" = "FREEHOLD_VPN_SUPPORT"

[export]
include = [
    "FFIRelayState",
    "FFIStatusType",
    "FFIStatusUpdate",
    "FFIConfig",
    "PacketCallback",
]

[export.rename]
"FFIRelayState" = "FreeholdRelayState"
"FFIStatusType" = "FreeholdStatusType"
"FFIStatusUpdate" = "FreeholdStatusUpdate"
"FFIConfig" = "FreeholdConfig"

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
prefix = ""
postfix = ""

[struct]
rename_fields = "CamelCase"

[parse]
parse_deps = false
include = []
