[package]
name = "freehold-platform-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
freehold-client-core = { path = "../../crates/freehold-client-core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
]}
