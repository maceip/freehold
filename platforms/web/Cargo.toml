[package]
name = "freehold-platform-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/maceip/freehold"
description = "Freehold Web Platform - WASM client with Direct Sockets API"

# Standalone crate - not part of parent workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
simd = []

[dependencies]
# Workspace dependencies
freehold-api = { path = "../../crates/freehold-api" }

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Error handling
console_error_panic_hook = { version = "0.1", optional = true }
anyhow = "1.0"
thiserror = "2.0"

# Async
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-web = "0.1"

# Time for WASM
web-time = "1.1"

# Serialization for JS interop
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Navigator",
  "Performance",
  # Direct Sockets API (IWA only)
  # These are not in web-sys yet, we'll use raw JS bindings
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = true
