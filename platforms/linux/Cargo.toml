[package]
name = "freehold-platform-linux"
version = "0.1.0"
edition = "2021"

# Exclude from parent workspace when building standalone
[workspace]

[dependencies]
freehold-client-core = { path = "../../crates/freehold-client-core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.10"
libadwaita = { version = "0.8", optional = true }

[features]
default = ["adwaita"]
adwaita = ["libadwaita"]
