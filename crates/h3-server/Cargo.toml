[package]
name = "h3-server"
version = "0.1.0"
edition = "2021"
description = "H3/QUIC static file server using quinn with HTTPS fallback"

[[bin]]
name = "h3-server"
path = "src/main.rs"

[dependencies]
# QUIC/H3 - quinn ecosystem
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

# TCP/HTTPS - hyper ecosystem
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
tokio-rustls = "0.26"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS cert generation
rcgen = "0.13"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# MIME types
mime_guess = "2"

# HTTP types
http = "1"
bytes = "1"

# Futures
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
