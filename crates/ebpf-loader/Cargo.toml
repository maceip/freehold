[package]
name = "ebpf-loader"
version = "0.1.0"
edition = "2021"
description = "Userspace loader for the eBPF XDP program"

[dependencies]
aya = "0.13"
aya-log = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal"] }
