[package]
name = "freehold-android-bridge"
description = "Android FFI bindings for Freehold client (UniFFI/Kotlin)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
name = "freehold_android"

[dependencies]
# Internal crates
freehold-api.workspace = true
freehold-client-core = { workspace = true, features = ["h3-proxy"] }

# UniFFI for Kotlin bindings
uniffi = { version = "0.29" }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Networking
bytes.workspace = true

# HTTP/3 + WebTransport (client)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
h3 = { path = "../../vendor/h3-patched/h3" }
h3-quinn = { path = "../../vendor/h3-patched/h3-quinn", features = ["datagram"] }
h3-webtransport = { path = "../../vendor/h3-patched/h3-webtransport" }
h3-datagram = { path = "../../vendor/h3-patched/h3-datagram" }
http = "1.2"

# Android-specific
jni = "0.21"
android_logger = "0.14"
log = "0.4"

# For parking_lot on Android
parking_lot = "0.12"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindgen = ["uniffi/cli"]
