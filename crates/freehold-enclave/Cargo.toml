[package]
name = "freehold-enclave"
description = "SGX enclave for Freehold secret management and attestation"
version.workspace = true
edition.workspace = true

[lib]
name = "freehold_enclave"
path = "src/lib.rs"

[[bin]]
name = "freehold-enclave"
path = "src/main.rs"

[dependencies]
freehold-api.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror.workspace = true

[features]
default = []
# Mock attestation for testing without SGX hardware
# Real SGX attestation happens via Gramine's RA-TLS or direct DCAP calls
mock-attestation = []
