[package]
name = "freehold-enclave"
description = "SGX enclave for Freehold secret management and attestation"
version.workspace = true
edition.workspace = true

[lib]
name = "freehold_enclave"
path = "src/lib.rs"

[[bin]]
name = "freehold-enclave"
path = "src/main.rs"

[dependencies]
freehold-api.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
thiserror.workspace = true

# For quote generation (optional, only on SGX platforms)
[target.'cfg(target_os = "linux")'.dependencies]
# DCAP quote generation
dcap-ql = { version = "0.3", optional = true }

[features]
default = []
# Enable SGX quote generation (requires SGX hardware + Gramine)
sgx = ["dcap-ql"]
# Mock attestation for testing without SGX
mock-attestation = []
