[package]
name = "freehold-client"
description = "Freehold client - desktop tray application"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "freehold"
path = "src/main.rs"

[dependencies]
freehold-client-core = { workspace = true, features = ["h3-proxy"] }

tokio = { workspace = true, features = ["signal", "net", "io-util"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rustls-pemfile.workspace = true
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Service and update
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
freehold-platform-macos = { path = "../../platforms/macos" }

[target.'cfg(target_os = "windows")'.dependencies]
freehold-platform-windows = { path = "../../platforms/windows" }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
freehold-platform-linux = { path = "../../platforms/linux" }
