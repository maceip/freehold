[package]
name = "freehold-client-core"
description = "Headless client engine for the Freehold anycast relay network"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["networking", "nat", "quic", "anycast"]
categories = ["network-programming"]

[dependencies]
freehold-api.workspace = true
freehold-h3-proxy = { path = "../freehold-h3-proxy", version = "1.0.0", optional = true }

tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
rand = "0.9"

# Shared socket (DemuxSocket)
quinn = { version = "0.11", optional = true }

# ACME certificate management (optional)
instant-acme = { version = "0.7", optional = true }
rcgen = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
dirs = { version = "6", optional = true }

[features]
default = ["h3-proxy"]
h3-proxy = ["freehold-h3-proxy", "quinn"]
webtransport = ["h3-proxy"]
acme = ["instant-acme", "rcgen", "rustls", "rustls-pemfile", "serde", "serde_json", "dirs", "h3-proxy"]

[dev-dependencies]
proptest = "1.5"
tempfile = "3"
