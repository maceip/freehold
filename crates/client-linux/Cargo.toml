[package]
name = "client-linux"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
client-core = { path = "../client-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.9"
libadwaita = { version = "0.7", optional = true }
ashpd = { version = "0.9", optional = true }  # Portal APIs for sandboxed apps

[features]
default = ["adwaita"]
adwaita = ["libadwaita"]
portals = ["ashpd"]
