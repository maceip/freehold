[package]
name = "freehold-server"
description = "Freehold relay server daemon"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "freehold_server"
path = "src/lib.rs"

[[bin]]
name = "freehold-server"
path = "src/main.rs"

[dependencies]
freehold-common.workspace = true
freehold-api.workspace = true

tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
bytes.workspace = true

aya = "0.13"
aya-log = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
data-encoding = "2"
libc = "0.2"
ipnet = { version = "2.10", features = ["serde"] }

[dev-dependencies]
proptest = "1.4"
freehold-client-core = { path = "../freehold-client-core", default-features = false }
