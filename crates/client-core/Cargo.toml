[package]
name = "client-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# QUIC/H3 - tquic for multipath support
tquic = { version = "1.6", features = ["h3"] }

# HTTP client for TCP proxy backend
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
http = "1"

# TLS for cert generation
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"

# Networking
bytes = "1"
mio = { version = "1", features = ["net", "os-poll"] }
socket2 = { version = "0.5", features = ["all"] }

# Utilities
rustc-hash = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
