[package]
name = "client-macos"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
client-core = { path = "../client-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# macOS native bindings
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSRunLoop", "NSThread"] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusItem",
    "NSImage",
    "NSButton",
    "NSTextField",
    "NSStackView",
    "NSColor",
    "NSResponder",
    "NSRunningApplication",
] }
