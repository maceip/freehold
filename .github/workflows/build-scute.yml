name: Build Scute Binaries

on:
  push:
    branches: [main]
    paths:
      - 'crates/freehold-scute/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-h3-proxy/**'
      - 'crates/freehold-api/**'
      - '.github/workflows/build-scute.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/freehold-scute/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-h3-proxy/**'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ===========================================================================
  # Desktop/Server binaries (spawned as subprocess by npm package)
  # ===========================================================================
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux x86_64 (musl static — works on any glibc) ---
          - name: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            npm-os: linux
            npm-cpu: x64
            binary: scute-service
            cross: false

          # --- Linux ARM64 (musl static) ---
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            npm-os: linux
            npm-cpu: arm64
            binary: scute-service
            cross: true

          # --- macOS x86_64 ---
          - name: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            npm-os: darwin
            npm-cpu: x64
            binary: scute-service
            cross: false

          # --- macOS ARM64 (Apple Silicon) ---
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            npm-os: darwin
            npm-cpu: arm64
            binary: scute-service
            cross: false

          # --- Windows x86_64 ---
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            npm-os: win32
            npm-cpu: x64
            binary: scute-service.exe
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compilation tools
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --package freehold-scute
          else
            cargo build --release --target ${{ matrix.target }} --package freehold-scute
          fi
        shell: bash

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: scute-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 7