name: Build Windows Client

on:
  push:
    branches: [main]
    paths:
      - 'platforms/windows/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-h3-proxy/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'platforms/windows/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Build Windows client
        working-directory: platforms/windows
        run: cargo build --release

      - name: List build artifacts
        shell: pwsh
        run: |
          Write-Host "=== Build artifacts ==="
          Get-ChildItem -Path platforms/windows/target/release -Filter "*.exe" | Format-Table Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: freehold-windows-client
          path: platforms/windows/target/release/*.exe
          retention-days: 30

      - name: Attest Windows binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: platforms/windows/target/release/*.exe

  # Cross-compile from Linux (faster, no Windows runner minutes)
  build-windows-cross:
    name: Build Windows (Cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-cross-

      - name: Build Windows client (cross-compile)
        working-directory: platforms/windows
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Upload cross-compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: freehold-windows-client-cross
          path: platforms/windows/target/x86_64-pc-windows-gnu/release/*.exe
          retention-days: 30
