name: Relay Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-common/**'
      - '.github/workflows/test-relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================
  # UNIT TESTS - Core logic without platform deps
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            clang \
            llvm \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        run: |
          cargo test --workspace \
            --exclude freehold-ebpf \
            --exclude freehold-android-bridge \
            --exclude freehold-platform-windows

      - name: Test summary
        run: |
          echo "=== Test Summary ==="
          cargo test --workspace \
            --exclude freehold-ebpf \
            --exclude freehold-android-bridge \
            --exclude freehold-platform-windows \
            -- --list 2>/dev/null | grep -E "^[a-z].*: test$" | wc -l | xargs echo "Total tests:"

  # ============================================
  # PROTOCOL TESTS - Wire format compliance
  # ============================================
  protocol-tests:
    name: Protocol Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-protocol-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-protocol-

      - name: Run protocol tests
        run: |
          echo "=== Protocol Message Tests ==="
          cargo test --package freehold-api --lib -- --nocapture

      - name: Run property-based tests
        run: |
          echo "=== Property-Based Protocol Tests ==="
          cargo test --package freehold-api --lib proptests -- --nocapture

  # ============================================
  # SERVER LOGIC TESTS - Cookie & Quota
  # ============================================
  server-logic-tests:
    name: Server Logic Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-server-

      - name: Run cookie tests
        run: |
          echo "=== Cookie Authentication Tests ==="
          cargo test --package freehold-server --lib cookie -- --nocapture

      - name: Run quota tests
        run: |
          echo "=== Quota Tracking Tests ==="
          cargo test --package freehold-server --lib quota -- --nocapture

      - name: Run all server library tests
        run: |
          echo "=== All Server Library Tests ==="
          cargo test --package freehold-server --lib -- --nocapture

  # ============================================
  # DATA STRUCTURE TESTS - Common types
  # ============================================
  common-tests:
    name: Common Data Structures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-common-

      - name: Run common structure tests
        run: |
          echo "=== Common Data Structure Tests ==="
          cargo test --package freehold-common --lib -- --nocapture

  # ============================================
  # CLIENT STATE MACHINE TESTS
  # ============================================
  client-state-tests:
    name: Client State Machine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-client-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-client-

      - name: Run client state machine tests
        run: |
          echo "=== Client State Machine Tests ==="
          cargo test --package freehold-client-core --lib -- --nocapture

      - name: Run property-based tests
        run: |
          echo "=== Property-Based Client Tests ==="
          cargo test --package freehold-client-core --lib proptests -- --nocapture

  # ============================================
  # E2E INTEGRATION TESTS (no eBPF)
  # ============================================
  e2e-integration-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-

      - name: Run E2E tests
        run: |
          echo "=== E2E Integration Tests ==="
          cargo test --package freehold-e2e-tests --lib -- --nocapture

      - name: Run server integration tests
        run: |
          echo "=== Server Integration Tests ==="
          cargo test --package freehold-server --test integration -- --nocapture
