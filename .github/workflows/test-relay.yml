name: Relay Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-common/**'
      - '.github/workflows/test-relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-common/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shared cache key prefix for all jobs
  CACHE_VERSION: v1

jobs:
  # ============================================
  # LIBRARY TESTS - Protocol, Common, Client Core
  # Uses matrix to reduce duplication (#9)
  # ============================================
  library-tests:
    name: Library Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - freehold-api
          - freehold-common
          - freehold-client-core
        include:
          - crate: freehold-api
            display: Protocol
          - crate: freehold-common
            display: Common
          - crate: freehold-client-core
            display: Client State Machine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Improved cache key strategy (#11)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ matrix.crate }}-
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run library tests
        run: |
          echo "=== ${{ matrix.display }} Tests ==="
          cargo test --package ${{ matrix.crate }} --lib -- --nocapture

      - name: Run property-based tests (if any)
        run: |
          echo "=== Property-Based Tests ==="
          cargo test --package ${{ matrix.crate }} --lib proptests -- --nocapture || echo "No proptest tests found"

  # ============================================
  # SERVER LOGIC TESTS - Cookie & Quota
  # Needs library-tests to ensure shared deps are built (#10)
  # ============================================
  server-logic-tests:
    name: Server Logic Tests
    runs-on: ubuntu-latest
    needs: [library-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required packages - must succeed (#8)
      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Improved cache key strategy (#11)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-server-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-server-
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run cookie tests
        run: |
          echo "=== Cookie Authentication Tests ==="
          cargo test --package freehold-server --lib cookie -- --nocapture

      - name: Run quota tests
        run: |
          echo "=== Quota Tracking Tests ==="
          cargo test --package freehold-server --lib quota -- --nocapture

      - name: Run all server library tests
        run: |
          echo "=== All Server Library Tests ==="
          cargo test --package freehold-server --lib -- --nocapture

  # ============================================
  # UNIT TESTS - Full workspace (excludes platform-specific)
  # Needs library-tests for cache warm-up (#10)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [library-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required packages - must succeed (#8)
      - name: Install required system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            clang \
            llvm

      # Optional GUI dependencies - can fail (#8)
      - name: Install optional GUI dependencies
        run: |
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev || echo "Optional GUI dependencies not available (non-fatal)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Improved cache key strategy (#11)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-test-
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: |
          cargo test --workspace \
            --exclude freehold-ebpf \
            --exclude freehold-android-bridge \
            --exclude freehold-platform-windows

      - name: Test summary
        run: |
          echo "=== Test Summary ==="
          cargo test --workspace \
            --exclude freehold-ebpf \
            --exclude freehold-android-bridge \
            --exclude freehold-platform-windows \
            -- --list 2>/dev/null | grep -E "^[a-z].*: test$" | wc -l | xargs echo "Total tests:"

  # ============================================
  # E2E INTEGRATION TESTS (no eBPF)
  # Needs server-logic-tests to ensure server is tested first (#10)
  # ============================================
  e2e-integration-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    needs: [server-logic-tests, library-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Improved cache key strategy (#11)
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-e2e-
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run E2E tests
        run: |
          echo "=== E2E Integration Tests ==="
          cargo test --package freehold-e2e-tests --lib -- --nocapture

      - name: Run server integration tests
        run: |
          echo "=== Server Integration Tests ==="
          cargo test --package freehold-server --test integration -- --nocapture
