name: Relay Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-common/**'
      - '.github/workflows/test-relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/freehold-server/**'
      - 'crates/freehold-client/**'
      - 'crates/freehold-client-core/**'
      - 'crates/freehold-api/**'
      - 'crates/freehold-common/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Shared cache key prefix for all jobs
  CACHE_VERSION: v1

jobs:
  # ============================================
  # LIBRARY TESTS - Protocol, Common, Client Core
  # Uses matrix to reduce duplication (#9)
  # ============================================
  library-tests:
    name: Library Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - freehold-api
          - freehold-common
          - freehold-client-core
        include:
          - crate: freehold-api
            display: Protocol
          - crate: freehold-common
            display: Common
          - crate: freehold-client-core
            display: Client State Machine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run tests for ${{ matrix.display }}
        run: cargo test --package ${{ matrix.crate }} --verbose

  # ============================================
  # SERVER TESTS
  # ============================================
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run server tests
        run: cargo test --package freehold-server --verbose

  # ============================================
  # CLIENT TESTS
  # ============================================
  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run client tests
        run: cargo test --package freehold-client --verbose

  # ============================================
  # INTEGRATION TESTS
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [library-tests, server-tests, client-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Run integration tests
        run: cargo test --workspace --verbose