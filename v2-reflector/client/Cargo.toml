[package]
name = "specular-client"
version = "0.1.0"
edition = "2021"
description = "Specular Sovereign Proxy - expose local services to the internet"

[[bin]]
name = "specular"
path = "src/main.rs"

[dependencies]
# Protocol
specular-common = { path = "../common" }
bincode = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }

# QUIC/H3
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# HTTP client for backend
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
http = "1"

# TLS certs
rcgen = "0.13"
rustls-pemfile = "2"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
bytes = "1"
rand = "0.8"
dirs = "6"
