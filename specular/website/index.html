<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>carebears</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: #0a0a0a;
      font-family: 'JetBrains Mono', monospace;
      touch-action: pan-y;
    }

    body.no-scroll {
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
    }

    .container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      position: fixed;
      top: 0;
      left: 0;
      contain: layout style paint;
    }

    .scroll-content {
      height: 500vh;
      height: 500dvh;
      pointer-events: none;
      display: none;
    }

    .scroll-content.active {
      display: block;
    }

    .letter {
      position: absolute;
      font-size: 18px;
      line-height: 1;
      font-weight: bold;
      color: #9370db;
      text-shadow: 0 0 10px rgba(147, 112, 219, 0.5);
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
      /* GPU acceleration */
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      contain: layout style;
    }

    .hint {
      position: absolute;
      bottom: 40px;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: #444;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: lowercase;
      opacity: 0.8;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .hint.hidden {
      opacity: 0;
    }

    .scroll-hint {
      position: fixed;
      bottom: 40px;
      bottom: calc(40px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: #444;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: lowercase;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .scroll-hint.visible {
      opacity: 0.8;
    }

    .page-marker {
      position: fixed;
      right: 20px;
      right: calc(20px + env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 100;
    }

    .page-marker.visible {
      opacity: 1;
    }

    .page-marker span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .page-marker span.active {
      background: #9370db;
      transform: scale(1.3);
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .letter {
        font-size: 14px;
      }

      .hint, .scroll-hint {
        font-size: 11px;
        bottom: 30px;
        bottom: calc(30px + env(safe-area-inset-bottom));
      }

      .page-marker {
        right: 12px;
        gap: 6px;
      }

      .page-marker span {
        width: 5px;
        height: 5px;
      }
    }

    /* Reduce motion for users who prefer it */
    @media (prefers-reduced-motion: reduce) {
      .letter {
        transition: none !important;
      }
    }
  </style>
</head>
<body class="no-scroll">
  <div class="container" id="container">
    <div class="hint" id="hint">touch to wake the bear</div>
  </div>
  <div class="scroll-content" id="scrollContent"></div>
  <div class="scroll-hint" id="scrollHint">scroll to explore</div>
  <div class="page-marker" id="pageMarker">
    <span class="active"></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <script>
    // Detect mobile
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth < 768;

    // Update hint text
    if (!isMobile) {
      document.getElementById('hint').textContent = 'move to wake the bear';
    }

    const BEAR_ART = `                         QQYSUSU          UQOQQQQUWY
                    USYSQSQWUY SUSSSW   SOS       QS
                 WSSY                WQQQ    QY     SW
 YUQQUYWUQQQSUSQW                          YS  USW   Q
           YQS                                    Y  UY
U     QUY                                        S
     US  QY                                      W  UY
   WU     Y                                       SQW
                                                   YSY
    YU  U                               WSQY         QY
U                     SQW                             U
 SQW                                                  YS
  SSW                                                  WU
  QY                                     YWY            Y
  QY                                    WUS QU          WU
  SY                  WUQYUY            U SOQ      Y     UU
  SW                  YUSQQQ   UY  Y  YYU     YY          YSSU
  WW                   W    UW           U  U                UU
  UW           YUUUWWYWWW  W     SOSOOS    U                 WS
 WQ                       S      UOQOQ      W                 WQ
SQW                       Y        YU                          SW
QW                                                             WW
SY                                           QW                UY
OY                        Q                 Y                 YS
Q                       YUYW                U                 SW
Q                           U              W                 WS
QY                           WY          W                  WQ
SSY                             YWYWWUW                    US
 WUY                               YQS                   YQU
   UW                               WSY                YQS
    US      YYY                                     YSQQQS
      QSSQUWYYYWSQU                   Y             Y    WQSW
U  SQQ            YS               YQWW UUWWSW              WQS
QOUY                          WSU                USW          YSU
Y                         YSW                        YW  WS     YSY
                        SU                Y             U  QW     SW
                     YS                  YWWWWW   Y       Y  QY    WSY
                     SY                Y    Y    Y         UY YU     USW
            WS     UY               Y   UWW         WWW      S U       WQS
          UQY     S               WWWWW UWW    Y     Y        SYQYUY     U
           WU    Q            WY  WWWWW YWY   Y                U S       W
            YQ  U             Y     YWWU Y                      QYQ
             YQU                                  WWWW           WWW`;

    const lines = BEAR_ART.split('\n');
    const bearHeight = lines.length;
    const bearWidth = Math.max(...lines.map(l => l.length));

    function parseBearPositions() {
      const positions = [];
      for (let y = 0; y < lines.length; y++) {
        for (let x = 0; x < lines[y].length; x++) {
          if (lines[y][x] !== ' ') {
            positions.push({ x, y, char: lines[y][x] });
          }
        }
      }
      return positions;
    }

    function groupByChar(positions) {
      const groups = {};
      positions.forEach(pos => {
        if (!groups[pos.char]) groups[pos.char] = [];
        groups[pos.char].push(pos);
      });
      return groups;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const bearPositions = parseBearPositions();
    const charGroups = groupByChar(bearPositions);
    const uniqueChars = Object.keys(charGroups).sort();

    const container = document.getElementById('container');
    const hint = document.getElementById('hint');
    const scrollContent = document.getElementById('scrollContent');
    const scrollHint = document.getElementById('scrollHint');
    const pageMarker = document.getElementById('pageMarker');

    let activated = false;
    let assembled = false;
    let scrollRAF = null;
    const allElements = [];

    // Responsive character sizing
    const CHAR_W = isMobile ? 5 : 6;
    const CHAR_H = isMobile ? 10 : 12;

    function getLayout() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const charsPerRow = Math.ceil(uniqueChars.length / 2);
      const stackSpacing = isMobile ? 35 : 50;
      const stackWidth = charsPerRow * stackSpacing;
      const stackStartX = vw / 2 - stackWidth / 2;
      const stackStartY = vh / 2 - 40;

      const bearPixelW = bearWidth * CHAR_W;
      const bearPixelH = bearHeight * CHAR_H;
      const bearStartX = vw / 2 - bearPixelW / 2;
      const bearStartY = vh / 2 - bearPixelH / 2;

      return { stackStartX, stackStartY, stackSpacing, charsPerRow, bearStartX, bearStartY, bearPixelW, bearPixelH, vw, vh };
    }

    function init() {
      const { stackStartX, stackStartY, stackSpacing, charsPerRow, bearStartX, bearStartY } = getLayout();

      // Use DocumentFragment for batch DOM insertion
      const fragment = document.createDocumentFragment();

      const stackPositions = [];
      uniqueChars.forEach((char, charIndex) => {
        const row = charIndex < charsPerRow ? 0 : 1;
        const col = charIndex < charsPerRow ? charIndex : charIndex - charsPerRow;
        const stackX = stackStartX + col * stackSpacing;
        const stackY = stackStartY + row * (isMobile ? 45 : 60);

        const instances = charGroups[char];
        instances.forEach(() => {
          const offsetX = (Math.random() - 0.5) * (isMobile ? 10 : 14);
          const offsetY = (Math.random() - 0.5) * (isMobile ? 10 : 14);
          stackPositions.push({
            char,
            x: stackX + offsetX,
            y: stackY + offsetY
          });
        });
      });

      const targetPositions = bearPositions.map(pos => ({
        char: pos.char,
        x: bearStartX + pos.x * CHAR_W,
        y: bearStartY + pos.y * CHAR_H,
        gridY: pos.y,
        gridX: pos.x
      }));

      const targetsByChar = {};
      targetPositions.forEach(t => {
        if (!targetsByChar[t.char]) targetsByChar[t.char] = [];
        targetsByChar[t.char].push(t);
      });

      const stacksByChar = {};
      stackPositions.forEach(s => {
        if (!stacksByChar[s.char]) stacksByChar[s.char] = [];
        stacksByChar[s.char].push(s);
      });

      uniqueChars.forEach(char => {
        const stacks = stacksByChar[char];
        const targets = shuffle(targetsByChar[char]);

        stacks.forEach((stack, i) => {
          const target = targets[i];

          const el = document.createElement('span');
          el.className = 'letter';
          el.textContent = char;
          el.style.left = stack.x + 'px';
          el.style.top = stack.y + 'px';

          el._startX = stack.x;
          el._startY = stack.y;
          el._targetX = target.x;
          el._targetY = target.y;
          el._gridY = target.gridY;
          el._gridX = target.gridX;
          el._depth = target.gridY / bearHeight;

          // Shorter animations on mobile for performance
          const durationMult = isMobile ? 0.7 : 1;
          el._delay = Math.random() * 3500 * durationMult;
          el._duration = (4000 + Math.random() * 6000) * durationMult;

          el._wobbleFreqX = 3 + Math.random() * 8;
          el._wobbleFreqY = 2 + Math.random() * 6;
          el._wobbleAmpX = (2 + Math.random() * 8) * (isMobile ? 0.7 : 1);
          el._wobbleAmpY = (1 + Math.random() * 5) * (isMobile ? 0.7 : 1);

          el._overshoot = 0.5 + Math.random() * 2;
          el._pauseAt = Math.random() < (isMobile ? 0.15 : 0.3) ? 0.3 + Math.random() * 0.4 : null;
          el._pauseDuration = (200 + Math.random() * 800) * (isMobile ? 0.5 : 1);
          el._speedMult = 0.6 + Math.random() * 0.8;

          fragment.appendChild(el);
          allElements.push(el);
        });
      });

      container.appendChild(fragment);
    }

    function enableScrolling() {
      document.body.classList.remove('no-scroll');
      scrollContent.classList.add('active');
      scrollHint.classList.add('visible');
      pageMarker.classList.add('visible');

      setTimeout(() => {
        scrollHint.classList.remove('visible');
      }, 3000);

      // Use passive listener for smooth scrolling
      window.addEventListener('scroll', onScroll, { passive: true });
    }

    // Throttled scroll handler using RAF
    let lastScrollY = 0;
    let ticking = false;

    function onScroll() {
      lastScrollY = window.scrollY;
      if (!ticking) {
        requestAnimationFrame(handleScroll);
        ticking = true;
      }
    }

    function handleScroll() {
      ticking = false;

      const scrollY = lastScrollY;
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const scrollProgress = Math.min(scrollY / maxScroll, 1);

      // Update page markers
      const pageMarkers = pageMarker.querySelectorAll('span');
      const currentPage = Math.floor(scrollProgress * 5);
      pageMarkers.forEach((m, i) => {
        m.classList.toggle('active', i <= currentPage);
      });

      // Batch transform updates
      const centerX = window.innerWidth / 2;

      allElements.forEach(el => {
        const depthFactor = 0.3 + el._depth * 0.7;
        const offsetY = -scrollY * depthFactor * 0.5;
        const distFromCenter = el._targetX - centerX;
        const spreadX = distFromCenter * scrollProgress * 0.3;
        const rotation = (el._gridX - bearWidth / 2) * scrollProgress * 0.5;
        const scale = 1 + scrollProgress * (1 - el._depth) * 0.2;
        const opacity = 1 - scrollProgress * 0.3;

        const dx = el._targetX - el._startX;
        const dy = el._targetY - el._startY;

        // Use translate3d for GPU acceleration
        el.style.transform = `translate3d(${dx + spreadX}px, ${dy + offsetY}px, 0) rotate(${rotation}deg) scale(${scale})`;
        el.style.opacity = opacity;
      });
    }

    function scurry() {
      if (activated) return;
      activated = true;
      hint.classList.add('hidden');

      let maxEndTime = 0;
      const startNow = performance.now();

      allElements.forEach(el => {
        const dx = el._targetX - el._startX;
        const dy = el._targetY - el._startY;

        const elStartTime = startNow + el._delay;
        const baseDuration = el._duration;
        let pauseStart = null;
        let totalPauseTime = 0;
        let pauseTriggered = false;

        const endTime = el._delay + baseDuration / el._speedMult + (el._pauseAt ? el._pauseDuration : 0);
        if (endTime > maxEndTime) maxEndTime = endTime;

        function easeOutBack(t, overshoot) {
          const c1 = overshoot;
          const c3 = c1 + 1;
          return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
        }

        function animate(now) {
          if (now < elStartTime) {
            requestAnimationFrame(animate);
            return;
          }

          let elapsed = (now - elStartTime - totalPauseTime) * el._speedMult;
          let progress = Math.min(elapsed / baseDuration, 1);

          if (el._pauseAt && !pauseTriggered && progress >= el._pauseAt && progress < 1) {
            if (!pauseStart) {
              pauseStart = now;
            }
            if (now - pauseStart < el._pauseDuration) {
              const jitterX = (Math.random() - 0.5) * 1;
              const jitterY = (Math.random() - 0.5) * 1;
              const eased = easeOutBack(el._pauseAt, el._overshoot);
              const currentX = dx * eased + jitterX;
              const currentY = dy * eased + jitterY;
              el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
              requestAnimationFrame(animate);
              return;
            } else {
              totalPauseTime += el._pauseDuration;
              pauseTriggered = true;
            }
          }

          elapsed = (now - elStartTime - totalPauseTime) * el._speedMult;
          progress = Math.min(elapsed / baseDuration, 1);

          const eased = easeOutBack(progress, el._overshoot);
          const fadeOut = Math.pow(1 - progress, 2);
          const wobbleX = Math.sin(progress * Math.PI * el._wobbleFreqX) * el._wobbleAmpX * fadeOut;
          const wobbleY = Math.cos(progress * Math.PI * el._wobbleFreqY) * el._wobbleAmpY * fadeOut;

          const currentX = dx * eased + wobbleX;
          const currentY = dy * eased + wobbleY;

          el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

          if (progress < 1) {
            requestAnimationFrame(animate);
          }
        }

        requestAnimationFrame(animate);
      });

      setTimeout(() => {
        assembled = true;
        enableScrolling();
      }, maxEndTime + 500);
    }

    // Event listeners
    if (isMobile) {
      container.addEventListener('touchstart', scurry, { once: true, passive: true });
    } else {
      container.addEventListener('mousemove', scurry, { once: true, passive: true });
    }
    container.addEventListener('click', scurry, { once: true, passive: true });
    document.addEventListener('keydown', scurry, { once: true });

    init();

    // Handle resize/orientation change
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (!activated) {
          allElements.forEach(el => el.remove());
          allElements.length = 0;
          init();
        }
      }, 200);
    });

    // Prevent overscroll bounce on iOS
    document.body.addEventListener('touchmove', (e) => {
      if (document.body.classList.contains('no-scroll')) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>
</body>
</html>
